<script>
const P=[1000,2000,3000,5000,10000,20000,40000,80000,160000,320000,640000,1250000,2500000,5000000,10000000];
const money=n=>n>=1e7?"₹1 Crore":"₹"+n.toLocaleString("en-IN");

// B ek 2D array hoga jisme index 0 se 14 tak har level ke apne questions honge
let B = Array.from({length: 15}, () => []);
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("kbcSeen")||"[]")) } catch(e) {}

// ==========================================
// LEVEL-WISE CSV FETCHING & PARSING LOGIC
// ==========================================
async function loadQuestionsFromCSV() {
  try {
    const response = await fetch('questions.csv?t=' + new Date().getTime());
    const csvText = await response.text();
    
    const rows = [];
    let currentRow = [];
    let currentField = '';
    let inQuotes = false;
    
    for (let i = 0; i < csvText.length; i++) {
      let char = csvText[i];
      let nextChar = csvText[i + 1];
      
      if (char === '"' && inQuotes && nextChar === '"') {
        currentField += '"';
        i++;
      } else if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        currentRow.push(currentField.trim());
        currentField = '';
      } else if ((char === '\r' || char === '\n') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        currentRow.push(currentField.trim());
        if (currentRow.some(field => field !== '')) rows.push(currentRow);
        currentRow = [];
        currentField = '';
      } else {
        currentField += char;
      }
    }
    if (currentField !== '' || currentRow.length > 0) {
      currentRow.push(currentField.trim());
      if (currentRow.some(field => field !== '')) rows.push(currentRow);
    }

    // Expected CSV Format: [Level, Question, Option1, Option2, Option3, Option4, CorrectOption]
    // Example: 1, "What is...", "Opt1", "Opt2", "Opt3", "Opt4", "c"
    let loadedCount = 0;
    for (let row of rows) {
      if (row.length >= 7) {
        let levelNum = parseInt(row[0]) - 1; // 1-indexed to 0-indexed (Level 1 becomes index 0)
        let qText = row[1];
        let opts = [row[2], row[3], row[4], row[5]];
        let ansRaw = row[6].toLowerCase();
        let ansIdx = {'a':0, 'b':1, 'c':2, 'd':3}[ansRaw];
        if (ansIdx === undefined) ansIdx = parseInt(ansRaw) || 0;

        // Agar level 0 se 14 ke beech mein hai, toh use uss level ke bucket mein daal do
        if (!isNaN(levelNum) && levelNum >= 0 && levelNum < 15) {
          B[levelNum].push([qText, opts, ansIdx]);
          loadedCount++;
        }
      }
    }

    // Fallback safety: Agar kisi level mein koi question nahi aaya, toh default question daal dein taaki game crash na ho
    for (let i = 0; i < 15; i++) {
      if (B[i].length === 0) {
        B[i].push([`Sample Question for Level ${i+1}?`, ["Option A", "Option B", "Option C", "Option D"], 0]);
      }
    }

    console.log(`Successfully loaded and categorized ${loadedCount} questions level-wise from CSV.`);
  } catch (err) {
    console.error("Could not load questions.csv. Using fallback.", err);
    loadFallbackQuestions();
  }
}

function loadFallbackQuestions() {
  const defaultQ = [["What is the national animal of India?", ["Lion", "Tiger", "Elephant", "Leopard"], 1]];
  for (let i = 0; i < 15; i++) { B[i] = defaultQ; }
}

// Automatically load CSV when page opens
loadQuestionsFromCSV();

// ==========================================
// GAME ENGINE LOGIC
// ==========================================
function mk(q){const ix=[0,1,2,3].sort(()=>Math.random()-.5);return [q[0],ix.map(j=>q[1][j]),ix.indexOf(q[2])]}
function pickQ(i,ex){
  if (!B[i] || B[i].length === 0) return ["Sample Question?",["A","B","C","D"],0];
  const pool=B[i].filter(q=>q[0]!==ex);
  let fresh=pool.filter(q=>!seen.has(q[0]));
  if(!fresh.length){B[i].forEach(q=>seen.delete(q[0]));fresh=pool}
  const q=fresh[Math.floor(Math.random()*fresh.length)] || B[i][0];
  seen.add(q[0]);
  try{localStorage.setItem("kbcSeen",JSON.stringify([...seen]))}catch(e){}
  return mk(q);
}

const L="ABCD",\$=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let g;

let AC=null,pref={snd:true,vox:true};
try{Object.assign(pref,JSON.parse(localStorage.getItem("kbcPref")||"{}"))}catch(e){}
const TTS="speechSynthesis" in window;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,t,d,ty,v,f2){const c=ac();if(!c||!pref.snd)return;const T=c.currentTime+t,o=c.createOscillator(),gn=c.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);gn.gain.setValueAtTime(.0001,T);gn.gain.linearRampToValueAtTime(v||.12,T+.03);gn.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(gn);gn.connect(c.destination);o.start(T);o.stop(T+d+.05)}
const SFX={
start(){[196,247,294,392,494].forEach((f,i)=>tone(f,i*.16,1.1,"triangle",.12))},
pick(){tone(660,0,.09,"square",.05)},
lock(){tone(140,0,2.6,"sawtooth",.05,420);for(let i=0;i<10;i++)tone(98,i*.26,.2,"square",.07)},
ok(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.55,"triangle",.15))},
win(){[523,523,523,659,784,1047,1047,1319].forEach((f,i)=>tone(f,i*.2,.6,"triangle",.15))},
bad(){tone(240,0,.6,"sawtooth",.14,110);tone(170,.3,.8,"sawtooth",.14,70)},
life(){tone(500,0,.45,"sine",.12,1300)},
ring(){for(let i=0;i<2;i++){tone(1000,i,.18,"square",.05);tone(1000,i+.28,.18,"square",.05)}}
};
let voice=null;
function pickVoice(){const v=TTS?speechSynthesis.getVoices():[];voice=v.find(x=>x.lang==="en-IN")||v.find(x=>x.lang.startsWith("hi"))||v.find(x=>x.lang.startsWith("en"))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){if(!TTS||!pref.vox)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-IN";u.rate=.95;speechSynthesis.speak(u)}
const spk=n=>n>=1e7?"ek crore rupaye":n+" rupaye";
function announce(){const q=g.q;speak(`Sawaal number ${g.i+1}, ${spk(P[g.i])} ke liye. ${q[0]} ${q[1].map((t,k)=>"Option "+L[k]+", "+t+".").join(" ")}`)}
function ui(){$("snd").textContent=pref.snd?"🔊":"🔇";$("vox").textContent=pref.vox?"🎙️":"🤐";$("snd").setAttribute("aria-pressed",pref.snd);$("vox").setAttribute("aria-pressed",pref.vox)}
function toggle(k){pref[k]=!pref[k];if(k==="vox"&&!pref.vox&&TTS)speechSynthesis.cancel();try{localStorage.setItem("kbcPref",JSON.stringify(pref))}catch(e){}ui();if(pref.snd)SFX.pick()}
ui();
function show(s){["home","game","end"].forEach(x=>\$(x).classList.toggle("hidden",x!==s))}
function start(){g={i:0,q:pickQ(0),sel:null,ph:"pick",gone:[],used:{}};show("game");closeM();draw();SFX.start();announce()}
function safe(i){return i>9?P[9]:i>4?P[4]:0}
function draw(keep){
  const a=g.q[2];
  \$("playing").innerHTML=`Sawaal ${g.i+1} of 15 &nbsp;·&nbsp; Playing for <b>${money(P[g.i])}</b>`+([4,9].includes(g.i)?" &nbsp;🔒 Checkpoint":"");
  \$("qt").textContent=g.q[0];
  \$("opts").innerHTML=g.q[1].map((t,k)=>{
    let c="";
    if(g.ph==="done"&&k===a)c="ok";else if(g.ph==="done"&&k===g.sel)c="bad";
    else if(k===g.sel)c=g.ph==="locked"?"lockd":"sel";
    if(g.gone.includes(k))c+=" gone";
    return `<button class="opt ${c}" onclick="pick(${k})" ${g.ph!=="pick"?"disabled":""}><span class="in"><b>${L[k]}:</b> ${t}</span></button>`}).join("");
  const nm=[["f","🔀","50:50"],["a","👥","Audience Poll"],["p","📞","Phone a Friend"],["x","🔄","Flip Question"]];
  \$("lls").innerHTML=nm.map(([k,e,n])=>`<button class="ll" onclick="lifeline('${k}')" ${g.used[k]||g.ph!=="pick"?"disabled":""} aria-label="${n}"><i>${e}</i>${n}</button>`).join("");
  \$("lad").innerHTML=P.map((p,k)=>`<li class="${k===g.i?"cur":k<g.i?"done":""} ${[4,9].includes(k)?"cp":""}"><span>${k+1}</span><span>${money(p)}</span></li>`).reverse().join("");
  let act="";
  if(g.ph==="pick"&&g.sel!==null)act=`<button class="btn" onclick="lock()">Lock kiya jaye</button>`;
  if(g.ph==="done")act=g.ok?(g.i===14?`<button class="btn" onclick="finish('win')">Claim ₹1 Crore</button>`:`<button class="btn" onclick="next()">Agla sawaal</button>`):`<button class="btn" onclick="finish('bad')">See my winnings</button>`;
  \$("act").innerHTML=act;
  if(!keep)\$("msg").textContent=g.ph==="pick"&&g.sel===null?"Option chuniye, ya koi lifeline istemaal kijiye.":\$("msg").textContent;
  if(g.ph==="pick"&&g.sel!==null&&!keep)\$("msg").textContent="";
}
function msg(t){\$("msg").textContent=t}
function pick(k){if(g.ph!=="pick"||g.gone.includes(k))return;g.sel=k;SFX.pick();speak("Aapne "+L[k]+" chuna. Lock kiya jaye?");draw();msg(`Aapne ${L[k]}: ${g.q[1][k]} chuna hai. Pakka?`)}
function lock(){g.ph="locked";SFX.lock();speak("Lock kiya gaya.");draw();msg("Lock kiya gaya… dhadkan tez ho rahi hai 💓");setTimeout(reveal,2600)}
function reveal(){
  g.ph="done";g.ok=g.sel===g.q[2];draw();if(g.ok){SFX[g.i===14?"win":"ok"]();speak(g.i===14?"Badhai ho! Aap crorepati ban gaye!":"Sahi jawab! Aapne "+spk(P[g.i])+" jeet liye.")}else{SFX.bad();speak("Galat jawab. Sahi jawab tha "+L[g.q[2]]+", "+g.q[1][g.q[2]]+".")}
  if(g.ok)msg(g.i===14?"Aap CROREPATI ban gaye! 🎉":[4,9].includes(g.i)?`Sahi jawab! ${money(P[g.i])} ab pakka aapka hai. 🔒`:`Sahi jawab! Aapne ${money(P[g.i])} jeet liye.`);
  else msg(`Galat jawab. Sahi jawab tha ${L[g.q[2]]}: ${g.q[1][g.q[2]]}.`);
}
function next(){g.i++;g.q=pickQ(g.i);g.sel=null;g.ph="pick";g.gone=[];draw();announce()}
function finish(how){
  const amt=how==="win"?P[14]:how==="quit"?(g.i?P[g.i-1]:0):safe(g.i);
  const cleared=how==="win"?15:g.i;
  \$("eh").textContent=how==="win"?"Badhai ho! Aap crorepati hain!":how==="quit"?"Aapne khel chhoda":"Galat jawab, lekin khel acha tha";
  \$("ea").textContent=amt?money(amt):"₹0";
  \$("et").textContent=how==="win"?"Saare 15 sawaal sahi. Kamaal kar diya!":how==="quit"?"Samajhdari ka faisla. Aap itni rakam ghar le ja rahe hain.":(amt?`Aap pichhle checkpoint ki rakam le ja rahe hain.`:"Pehle checkpoint se pehle galat jawab, isliye rakam nahin mili.");
  \$("es").textContent=`${cleared} sawaal paar · ${Object.keys(g.used).length} of 4 lifelines used`;
  show("end");speak(amt?`Aap ghar le ja rahe hain ${spk(amt)}.`:"Is baar kuch nahin mila. Phir koshish kijiye.");
}
function askQuit(){
  const amt=g.i?P[g.i-1]:0;
  openM(`<h2>Khel chhodna chahte hain?</h2><p>Aap <b>${amt?money(amt):"₹0"}</b> ke saath ghar jayenge.</p><div class="act"><button class="btn" onclick="closeM();finish('quit')">Haan, quit</button><button class="btn ghost" onclick="closeM()">Nahin, khelte hain</button></div>`);
}
function openM(h){$("card").innerHTML=h;$("modal").classList.remove("hidden")}
function closeM(){\$("modal").classList.add("hidden")}
function lifeline(k){
  if(g.used[k]||g.ph!=="pick")return;
  g.used[k]=1;const a=g.q[2];
  const live=[0,1,2,3].filter(x=>!g.gone.includes(x));
  if(k==="f"){
    const wr=live.filter(x=>x!==a).sort(()=>Math.random()-.5).slice(0,2);
    g.gone.push(...wr);if(
